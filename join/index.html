<!doctype html>
<html lang="ro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0e1116">
<title>Live translation</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' rx='3' fill='%23f2b84b'/%3E%3C/svg%3E">
<link rel="stylesheet" href="/src/guest.css">
</head>
<body>
<header>
  <h1 id="titlu">Live translation</h1>
  <div id="stare" class="stare" hidden><span class="punct"></span><span id="stareText"></span></div>
  <button id="mic" class="mic" type="button" aria-label="A−" hidden>A−</button>
  <button id="mare" class="mic" type="button" aria-label="A+" hidden>A+</button>
</header>

<!-- 1. language (first) -->
<section id="pasLimba" class="pas" hidden>
  <p class="conectatLa"><span id="tConectatLa"></span> <b id="numeGazda"></b></p>
  <h2 id="tAlege"></h2>
  <div id="limbiInvitat" class="limbiInvitat"></div>
  <p id="mesajLimba" class="mesaj" hidden></p>
  <button id="btnAltCod" class="discret" type="button"></button>
</section>

<!-- 2. code -->
<section id="pasCod" class="pas">
  <h2 id="tCodTitlu"></h2>
  <p id="tCodText" class="estompat"></p>
  <form id="formCod">
    <label for="cod" id="tCod" class="eticheta"></label>
    <input id="cod" type="text" inputmode="text" autocomplete="off" autocapitalize="characters" spellcheck="false" maxlength="20" placeholder="ELIM1-K7Q4">
    <button id="btnIntra" class="principal" type="submit"></button>
  </form>
  <p id="mesajCod" class="mesaj" hidden></p>
</section>

<!-- 3. live -->
<section id="pasLive" hidden>
  <div class="bara">
    <button id="btnAsculta" class="asculta" type="button"></button>
    <div class="baraDreapta">
      <button id="btnLimba" class="discret" type="button"></button>
    </div>
  </div>
  <div id="optiuniAudio" class="optiuniAudio" hidden>
    <label><span id="tViteza"></span>
      <select id="viteza">
        <option value="0.85">0.85×</option>
        <option value="1">1×</option>
        <option value="1.15">1.15×</option>
        <option value="1.3">1.3×</option>
      </select>
    </label>
    <label class="bifa"><input type="checkbox" id="citesteVersete" checked> <span id="tCitesteVersete"></span></label>
  </div>
  <p id="indiciuAudio" class="indiciu" hidden></p>
  <div id="verset" hidden></div>
  <div id="lista">
    <div id="gol"><span id="tGol"></span><br><small id="tGolMic"></small></div>
    <p id="curent" hidden>…</p>
  </div>
  <button id="jos" type="button" hidden></button>
  <footer id="tSubsol"></footer>
</section>

<script type="module" src="/src/guest.js"></script>
</body>
</html>
